<section class="relative flex min-h-svh items-center overflow-hidden" aria-label="Introduction">
  <!-- Ambient backdrop -->
  <div class="pointer-events-none absolute inset-0 -z-10">
    <div class="absolute -top-40 -left-40 size-[36rem] rounded-full bg-violet/25 blur-[120px]"></div>
    <div class="absolute top-1/3 -right-40 size-[30rem] rounded-full bg-cyan/15 blur-[120px]"></div>
    <div
      class="absolute inset-0 bg-[linear-gradient(rgb(255_255_255/0.04)_1px,transparent_1px),linear-gradient(90deg,rgb(255_255_255/0.04)_1px,transparent_1px)] bg-[size:72px_72px] [mask-image:radial-gradient(ellipse_at_center,black_20%,transparent_75%)]"
    ></div>
  </div>

  <app-hero-canvas
    data-intro
    class="invisible absolute top-1/2 left-1/2 -z-10 size-[min(140vw,900px)] -translate-x-1/2 -translate-y-1/2 opacity-60 lg:left-[72%] lg:opacity-100"
  />

  <div class="hero-content mx-auto w-full max-w-6xl px-6 pt-28 pb-20">
    <div data-intro class="invisible max-w-3xl">
      @if (profile.available) {
        <div class="hero-fade glass mb-8 inline-flex items-center gap-2.5 rounded-full px-4 py-2 text-sm text-white/80">
          <span class="relative flex size-2.5">
            <span class="absolute inline-flex size-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex size-2.5 rounded-full bg-emerald-400"></span>
          </span>
          Available for new projects
        </div>
      }

      <p class="hero-fade mb-3 font-mono text-sm text-muted">Hi, my name is</p>
      <h1 class="hero-title font-display text-[clamp(3rem,10vw,8rem)] leading-[0.95] font-bold tracking-tighter">
        {{ profile.name }}<span class="text-gradient">.</span>
      </h1>

      <p class="hero-fade mt-6 h-[1.4em] font-display text-[clamp(1.4rem,3.5vw,2.4rem)] font-medium text-white/90">
        <span class="text-gradient">{{ typed() }}</span
        ><span class="ml-0.5 inline-block w-[3px] animate-pulse bg-cyan align-middle" style="height: 0.9em"></span>
      </p>

      <p class="hero-fade mt-6 max-w-xl text-lg leading-relaxed text-muted">{{ profile.tagline }}</p>

      <div class="hero-fade mt-10 flex flex-wrap items-center gap-4">
        <a
          appMagnetic
          href="#projects"
          (click)="scrollTo('projects', $event)"
          class="group relative inline-flex items-center gap-2 overflow-hidden rounded-full bg-gradient-to-r from-violet to-cyan px-7 py-4 font-medium text-white shadow-[0_10px_40px_-10px_rgb(139_92_246/0.8)]"
        >
          View my work
          <app-icon name="arrow" [size]="18" class="transition-transform duration-300 group-hover:rotate-45" />
        </a>
        <a
          appMagnetic
          [href]="profile.resumeUrl"
          class="glass inline-flex items-center gap-2 rounded-full px-7 py-4 font-medium text-white/90 transition-colors hover:bg-white/10"
        >
          <app-icon name="download" [size]="18" />
          Download CV
        </a>
      </div>

      <ul class="hero-fade mt-12 flex items-center gap-3" aria-label="Social links">
        @for (s of profile.socials; track s.label) {
          <li>
            <a
              appMagnetic
              [href]="s.url"
              target="_blank"
              rel="noopener"
              [attr.aria-label]="s.label"
              class="grid size-11 place-items-center rounded-full border border-line text-muted transition-colors hover:border-white/30 hover:text-white"
            >
              <app-icon [name]="s.icon" [size]="18" />
            </a>
          </li>
        }
      </ul>
    </div>
  </div>

  <a
    href="#about"
    (click)="scrollTo('about', $event)"
    class="absolute bottom-8 left-1/2 hidden -translate-x-1/2 flex-col items-center gap-2 text-xs tracking-[0.3em] text-muted uppercase md:flex"
  >
    Scroll
    <span class="relative h-12 w-px overflow-hidden bg-line">
      <span class="absolute inset-x-0 top-0 h-1/2 animate-[scroll-line_2s_ease-in-out_infinite] bg-gradient-to-b from-transparent to-cyan"></span>
    </span>
  </a>
</section>
